name: Update experiments

on:
  schedule:
    # 6:30 PM Pacific during daylight time, 5:30 PM during standard time.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:

concurrency:
  group: update-experiments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-market.txt

      - name: Install experiment dependencies
        run: pip install -r scripts/requirements-market.txt

      - name: Refresh all experiments
        run: |
          python scripts/update_market_data.py
          python scripts/update_stock_predictions.py
          python scripts/build_stock_bond_bandit.py
          python scripts/build_two_sector_bandit.py
          python scripts/build_market_attribution.py

      - name: Validate generated data
        run: python scripts/validate_experiment_data.py

      - name: Commit changed results
        run: |
          if git diff --quiet -- assets/data; then
            echo "No new completed market data."
            exit 0
          fi
          git config user.name "ritvikmath experiment bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "Update experiment results"
          git push
